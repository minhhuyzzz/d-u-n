<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mô hình 3D – Địa đạo Củ Chi (Đền tưởng niệm Bến Dược)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Montserrat",sans-serif;background:#dbe7f0}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.ttl{position:fixed;left:14px;top:12px;background:rgba(255,255,255,.92);border-radius:12px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:min(340px,calc(100% - 28px))}
.ttl b{display:block;text-transform:uppercase;color:#7a1616;font-size:1.05rem}.ttl small{color:#5a4a40}
.ui{position:fixed;left:14px;bottom:14px;right:14px;display:flex;flex-wrap:wrap;gap:8px}
.ui button{font:inherit;font-weight:700;font-size:.88rem;min-height:42px;padding:8px 16px;border-radius:999px;border:1px solid #cdb89d;background:rgba(255,255,255,.95);color:#2a1a14;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.ui button.on,.ui button:hover{background:#7a1616;border-color:#7a1616;color:#fff}
.ui button:focus-visible{outline:3px solid #d99a00;outline-offset:2px}
#ref{position:fixed;right:14px;top:12px;width:190px;border:4px solid #fff;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:none}
@media(max-width:600px){#ref{width:130px;top:auto;bottom:70px}}
html.emb .ttl{display:none}html.emb .ui{left:8px;right:8px;bottom:8px;gap:6px}html.emb .ui button{min-height:30px;padding:4px 12px;font-size:.74rem}html.emb #ref{width:110px;top:8px}
</style><script>try{if(top!==self)document.documentElement.classList.add("emb")}catch(e){document.documentElement.classList.add("emb")}</script></head><body>
<canvas id="c" aria-label="Mô hình 3D Địa đạo Củ Chi (Đền tưởng niệm Bến Dược), kéo để xoay, cuộn để phóng to"></canvas>
<div class="ttl"><b>Địa đạo Củ Chi (Đền tưởng niệm Bến Dược)</b><small>Mô hình 3D phỏng theo ảnh công trình · kéo để xoay, cuộn / chụm để phóng to</small></div>
<img id="ref" src="assets/img/dia-dao-cu-chi.webp" alt="Ảnh gốc" onerror="this.remove()">
<div class="ui">
<button id="bA" class="on" aria-pressed="true">Tự xoay</button>
<button data-v="iso">Góc 3/4</button><button data-v="front">Mặt trước</button><button data-v="top">Trên cao</button>
<button id="bR" aria-pressed="false">Ảnh gốc</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var c=document.getElementById('c');
var R=new THREE.WebGLRenderer({canvas:c,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
var sc=new THREE.Scene();sc.background=new THREE.Color(0xdbe7f0);
var cam=new THREE.PerspectiveCamera(36,1,1,700);
sc.add(new THREE.HemisphereLight(0xffffff,0x9aa88f,.9));
var sun=new THREE.DirectionalLight(0xfff1d6,.85);sun.position.set(-60,95,55);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);var sh=sun.shadow.camera;sh.left=sh.bottom=-100;sh.right=sh.top=100;sh.far=320;sc.add(sun);

/* ---------- kết cấu vẽ bằng canvas ---------- */
function tex(w,h,fn){var k=document.createElement('canvas');k.width=w;k.height=h;fn(k.getContext('2d'),w,h);
  var t=new THREE.CanvasTexture(k);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
function rep(t,x,y){var q=t.clone();q.needsUpdate=true;q.repeat.set(Math.max(x,1),Math.max(y,1));return q}
var TGlass=tex(128,128,function(g,w,h){var gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#7db6e6');gr.addColorStop(1,'#2c6aa0');
  g.fillStyle=gr;g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.28)';g.fillRect(8,8,50,h-22);
  g.fillStyle='#e8eef2';g.fillRect(0,h-7,w,7);g.fillRect(w-4,0,4,h)});
var TTower=tex(128,128,function(g,w,h){g.fillStyle='#4f8fa8';g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.22)';g.fillRect(10,10,44,h-26);
  g.fillStyle='#c9d6dc';g.fillRect(0,h-6,w,6);g.fillRect(w-3,0,3,h)});
var TWhite=tex(128,128,function(g,w,h){g.fillStyle='#f1efe9';g.fillRect(0,0,w,h);g.fillStyle='#4a6b86';g.fillRect(10,30,w-20,52);
  g.fillStyle='#dcd8cf';g.fillRect(w/2-2,30,4,52)});
var TGrey=tex(64,64,function(g,w,h){g.fillStyle='#c9c9c6';g.fillRect(0,0,w,h);g.fillStyle='#b4b4b1';g.fillRect(0,h-4,w,4)});
var TTile=tex(128,128,function(g,w,h){g.fillStyle='#a9a7a3';g.fillRect(0,0,w,h);g.strokeStyle='#8c8a86';g.lineWidth=3;g.strokeRect(0,0,w,h);
  g.fillStyle='rgba(255,255,255,.07)';g.fillRect(0,0,w/2,h/2);g.fillRect(w/2,h/2,w/2,h/2)});
var TSign=tex(256,64,function(g,w,h){g.fillStyle='#173a63';g.fillRect(0,0,w,h);g.fillStyle='#fff';g.font='bold 40px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('IUH',w/2,h/2+2)});

/* ---------- hàm dựng ---------- */
function std(o){return new THREE.MeshStandardMaterial(o)}
function add(m,x,y,z){m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;sc.add(m);return m}
function box(w,h,d,x,y,z,t,fl){var f=fl||3.5,mx=std({map:rep(t,d/4,h/f),roughness:.25,metalness:.2}),mz=std({map:rep(t,w/4,h/f),roughness:.25,metalness:.2}),
  tp=std({color:0xd8d8d4,roughness:.9});return add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[mx,mx,tp,tp,mz,mz]),x,y+h/2,z)}
function plain(w,h,d,x,y,z,col){return add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),std({color:col,roughness:.8})),x,y+h/2,z)}
var gm=[0x4f9a4a,0x3f8a40,0x5fa955,0x377d3b].map(function(c){return std({color:c,roughness:.9,flatShading:true})});
function tree(x,z,s){plain(.5*s,2.4*s,.5*s,x,0,z,0x6b4a2f);
  [[0,3.6,0,2.1],[1.1,3.1,.4,1.5],[-1,3.2,-.5,1.6],[.2,4.7,.3,1.4]].forEach(function(p,i){
    add(new THREE.Mesh(new THREE.SphereGeometry(p[3]*s,10,8),gm[i%4]),x+p[0]*s,p[1]*s,z+p[2]*s)})}
function bush(x,z,r){add(new THREE.Mesh(new THREE.SphereGeometry(r,10,8),gm[0]),x,r*.8,z)}
function car(x,z,col,rot){var g=new THREE.Group();
  [[2,.8,4.4,0,.7,0,col],[1.8,.7,2.3,0,1.4,-.2,0x2a3340]].forEach(function(p){var m=new THREE.Mesh(new THREE.BoxGeometry(p[0],p[1],p[2]),std({color:p[6],roughness:.4}));m.position.set(p[3],p[4],p[5]);m.castShadow=true;g.add(m)});
  g.position.set(x,0,z);g.rotation.y=rot||0;sc.add(g)}
function person(x,z,col){plain(.55,1.3,.4,x,.2,z,col);add(new THREE.Mesh(new THREE.SphereGeometry(.28,8,8),std({color:0xe3b894})),x,1.8,z)}

var sd=11;function rnd(){sd=(sd*16807)%2147483647;return sd/2147483647}
function hip(w,d,h,x,y,z,col){var g=new THREE.ConeGeometry(1,1,4);g.rotateY(Math.PI/4);var m=new THREE.Mesh(g,std({color:col,roughness:.7,flatShading:true}));m.scale.set(w/1.4142,h,d/1.4142);return add(m,x,y+h/2,z)}
function gable(w,h,d,x,y,z,col){var s=new THREE.Shape();s.moveTo(-w/2,0);s.lineTo(w/2,0);s.lineTo(0,h);s.closePath();var g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false});g.translate(0,0,-d/2);return add(new THREE.Mesh(g,std({color:col,roughness:.8})),x,y,z)}
function cyl(r,h,x,y,z,col){return add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),std({color:col,roughness:.7})),x,y+h/2,z)}
function cone(r,h,x,y,z,col,n){return add(new THREE.Mesh(new THREE.ConeGeometry(r,h,n||12),std({color:col,roughness:.9,flatShading:true})),x,y+h/2,z)}
function ground(col,w,d,col2){var g=add(new THREE.Mesh(new THREE.PlaneGeometry(420,420),std({color:col,roughness:1})),0,-.05,0);g.rotation.x=-Math.PI/2;g.castShadow=false;
  if(w){var p=add(new THREE.Mesh(new THREE.PlaneGeometry(w,d),std({color:col2,roughness:.95})),0,0,0);p.rotation.x=-Math.PI/2;p.castShadow=false}}
function fence(x0,x1,z,col){for(var x=x0;x<=x1;x+=1.6)plain(.12,2.2,.12,x,0,z,col);plain(x1-x0,.15,.15,(x0+x1)/2,2,z,col)}
function pines(n,xr,zr,skip){for(var i=0;i<n;i++){var x=(rnd()-.5)*xr,z=(rnd()-.5)*zr;if(skip&&skip(x,z))continue;var s=.8+rnd()*.9;plain(.5*s,2*s,.5*s,x,0,z,0x5a3d26);cone(2.6*s,9*s,x,2*s,z,0x2f6b3a,8);cone(2*s,6*s,x,7*s,z,0x3a7d44,8)}}
function lamp(x,z){plain(.18,4,.18,x,0,z,0x333333);add(new THREE.Mesh(new THREE.SphereGeometry(.4,8,8),std({color:0xfff2b0,emissive:0xffe9a0,emissiveIntensity:.6})),x,4.2,z)}

var TWall=tex(128,128,function(g,w,h){g.fillStyle='#f1d9b0';g.fillRect(0,0,w,h);g.fillStyle='#9c3a1c';[12,52,92].forEach(function(x){g.fillRect(x,10,10,h-20)});g.fillStyle='#7a2a14';g.fillRect(0,h-8,w,8)});
ground(0x4f8a45,0,0);
plain(7,.25,150,0,0,10,0xa7a7a4);plain(36,.25,40,0,0,-26,0xb9b4a8);
[-6,6].forEach(function(x){box(1.4,8,1.4,x,0,52,TWall,4)});box(15,1.4,3,0,8,52,TWall,1.4);hip(17,6,5,0,9.4,52,0xc4512a);
[-2.6,2.6].forEach(function(x){[-2.6,2.6].forEach(function(z){plain(.8,5,.8,x,0,18+z,0x9c3a1c)})});hip(9,9,4,0,5,18,0xc4512a);
box(34,7,18,0,0,-26,TWall,3.5);hip(42,26,6,0,7,-26,0xb2381c);hip(30,18,5,0,13,-26,0xc4512a);plain(3,2,3,0,18,-26,0xd9a43a);
for(var i=0;i<4;i++){box(7-i*.6,5,7-i*.6,-34,i*5.6,-8,TWall,5);hip(10-i*.8,10-i*.8,2.4,-34,i*5.6+5,-8,0xc4512a)}
hip(7,7,6,-34,22.4,-8,0xc4512a);
plain(.15,9,.15,-4,0,-14,0xcccccc);plain(.15,9,.15,4,0,-14,0xcccccc);
pines(70,170,150,function(x,z){return Math.abs(x)<9&&z>-40||Math.abs(x)<24&&z<-10&&z>-44||(x<-28&&x>-42&&z<2&&z>-16)});
person(-1,40,0xd4a017);person(2,34,0x2e4a7a);person(-2,30,0x7a2e2e);person(1,26,0x2e7a4a);

/* ---------- điều khiển góc nhìn ---------- */
var T=new THREE.Vector3(0,6,-6),S={th:.2,ph:1.05,d:135},tg=null,auto=true;
var V={iso:{th:.2,ph:1.05,d:135},front:{th:0,ph:1.38,d:125},top:{th:.3,ph:.32,d:150}};
function cl(v,a,b){return Math.max(a,Math.min(b,v))}
function stopAuto(){auto=false;bA.classList.remove('on');bA.setAttribute('aria-pressed','false')}
var bA=document.getElementById('bA'),bR=document.getElementById('bR'),ref=document.getElementById('ref');
bA.onclick=function(){auto=!auto;tg=null;bA.classList.toggle('on',auto);bA.setAttribute('aria-pressed',auto)};
bR.onclick=function(){var o=ref.style.display==='block';ref.style.display=o?'none':'block';bR.classList.toggle('on',!o);bR.setAttribute('aria-pressed',!o)};
document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){stopAuto();tg=V[b.dataset.v]}});
var P={};
c.addEventListener('pointerdown',function(e){c.setPointerCapture(e.pointerId);P[e.pointerId]=[e.clientX,e.clientY];tg=null;stopAuto()});
c.addEventListener('pointermove',function(e){var p=P[e.pointerId];if(!p)return;var ids=Object.keys(P);
  if(ids.length>1){var o=P[ids.filter(function(i){return i!=e.pointerId})[0]];
    S.d=cl(S.d*Math.hypot(p[0]-o[0],p[1]-o[1])/Math.hypot(e.clientX-o[0],e.clientY-o[1]),45,280)}
  else{S.th-=(e.clientX-p[0])*.006;S.ph=cl(S.ph-(e.clientY-p[1])*.005,.2,1.5)}
  P[e.pointerId]=[e.clientX,e.clientY]});
['pointerup','pointercancel'].forEach(function(ev){c.addEventListener(ev,function(e){delete P[e.pointerId]})});
c.addEventListener('wheel',function(e){e.preventDefault();stopAuto();tg=null;S.d=cl(S.d*(1+e.deltaY*.001),45,280)},{passive:false});
function size(){var w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
(function loop(){
  if(auto) S.th+=.0025;
  if(tg){S.th+=(tg.th-S.th)*.08;S.ph+=(tg.ph-S.ph)*.08;S.d+=(tg.d-S.d)*.08}
  cam.position.set(T.x+S.d*Math.sin(S.ph)*Math.sin(S.th),T.y+S.d*Math.cos(S.ph),T.z+S.d*Math.sin(S.ph)*Math.cos(S.th));
  cam.lookAt(T);R.render(sc,cam);requestAnimationFrame(loop);
})();
</script></body></html>
